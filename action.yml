name: Strife
description: Deterministic chaos testing and linearizability checking for distributed systems, with JUnit and job-summary reporting.
author: Muhammad Kemal Hafizh
branding:
  icon: zap
  color: red

inputs:
  command:
    description: >
      The strife command line without the leading "strife", e.g.
      "sim --system raft --seeds 1..200 --determinism --expect linearizable".
      Split on whitespace; quoting is not interpreted.
    required: true
  out:
    description: Directory for HTML/Markdown/JSON reports ("" to disable).
    required: false
    default: strife-out
  junit:
    description: Path of the JUnit XML report ("" to disable).
    required: false
    default: strife-junit.xml
  summary:
    description: Append a Markdown digest to the job summary page.
    required: false
    default: "true"
  upload:
    description: Upload the reports and the JUnit file as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact (must be unique within the workflow run).
    required: false
    default: strife-reports
  fail:
    description: Fail the step when strife exits non-zero (violation, inconclusive or error).
    required: false
    default: "true"
  go-version:
    description: Go version used to build Strife. Defaults to the version in Strife's go.mod.
    required: false
    default: ""
  push-server:
    description: >
      URL of a strife server (the self-hosted run registry). When set, the
      run's reports (or its campaign.json) are pushed there after the run,
      with the commit, branch and a link to this job.
    required: false
    default: ""
  push-project:
    description: Project on the strife server to push to.
    required: false
    default: ""
  push-token-env:
    description: Name of the environment variable holding the project's write token.
    required: false
    default: STRIFE_TOKEN
  push-oidc-audience:
    description: >
      Push with this job's GitHub OIDC identity token, minted for this
      audience, instead of a stored write token. The registry project needs
      an "oidc" rule for the audience and this repository, and the job
      "permissions: id-token: write".
    required: false
    default: ""
  sign-key-env:
    description: >
      Name of the environment variable holding an Ed25519 private key (the
      PEM that strife keygen writes), e.g. from a repository secret. When
      set, the run's reports (or its campaign.json) are signed before they
      are uploaded or pushed, so the registry and compliance dossiers count
      them as attested.
    required: false
    default: ""

outputs:
  exit-code:
    description: "strife's exit code: 0 passed, 1 violation, 2 usage error, 3 inconclusive, 4 error."
    value: ${{ steps.strife.outputs.exit-code }}
  outcome:
    description: "passed, violation, inconclusive, usage-error or error."
    value: ${{ steps.strife.outputs.outcome }}
  junit:
    description: Path of the JUnit XML report.
    value: ${{ steps.strife.outputs.junit }}
  report-dir:
    description: Directory holding the reports.
    value: ${{ steps.strife.outputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Download the release binary
      id: download
      shell: bash
      env:
        REF: ${{ github.action_ref }}
        REPO: ${{ github.action_repository }}
      run: |
        # Pinned to a release tag: use its signed-off archive instead of
        # compiling (saves the Go setup and build). Anything else builds.
        ok=false
        case "$REF" in
        v[0-9]*)
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          [ "$os" = macos ] && os=darwin
          arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          [ "$arch" = x64 ] && arch=amd64
          name="strife_${REF}_${os}_${arch}"
          base="https://github.com/${REPO}/releases/download/${REF}"
          dir="$RUNNER_TEMP/strife-dl"
          mkdir -p "$dir" "$RUNNER_TEMP/strife-bin"
          if [ "$os" != windows ] &&
            curl -fsSL -o "$dir/$name.tar.gz" "$base/$name.tar.gz" &&
            curl -fsSL -o "$dir/SHA256SUMS" "$base/SHA256SUMS" &&
            (cd "$dir" && grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -); then
            tar -xzf "$dir/$name.tar.gz" -C "$dir"
            mv "$dir/$name/strife" "$RUNNER_TEMP/strife-bin/strife"
            "$RUNNER_TEMP/strife-bin/strife" version
            ok=true
          else
            echo "::notice::no verified release binary for $REF on $os/$arch; building from source"
          fi
          ;;
        esac
        echo "ok=$ok" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.download.outputs.ok != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build strife
      if: steps.download.outputs.ok != 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/strife-bin"
        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$RUNNER_TEMP/strife-bin/strife" ./cmd/strife
        "$RUNNER_TEMP/strife-bin/strife" version

    - name: Run strife
      id: strife
      shell: bash
      env:
        STRIFE_ARGS: ${{ inputs.command }}
        STRIFE_OUT: ${{ inputs.out }}
        STRIFE_JUNIT: ${{ inputs.junit }}
        STRIFE_SUMMARY: ${{ inputs.summary }}
      run: STRIFE_BIN="$RUNNER_TEMP/strife-bin/strife" "$GITHUB_ACTION_PATH/scripts/github-action.sh"

    - name: Sign the reports
      if: ${{ always() && inputs.sign-key-env != '' && inputs.out != '' }}
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEY_ENV: ${{ inputs.sign-key-env }}
      run: |
        # A campaign is signed as one manifest; otherwise every run directory.
        strife="$RUNNER_TEMP/strife-bin/strife"
        [ -d "$OUT" ] || { echo "::notice::nothing to sign: $OUT does not exist"; exit 0; }
        [ -n "${!KEY_ENV:-}" ] || { echo "::error title=Strife signing::$KEY_ENV is empty"; exit 1; }
        signer="github-actions:$GITHUB_REPOSITORY"
        if [ -f "$OUT/campaign.json" ]; then
          "$strife" sign --campaign "$OUT/campaign.json" --key "env:$KEY_ENV" --signer "$signer"
        else
          find "$OUT" -name report.json | sort | head -n 50 | while read -r r; do
            "$strife" sign --report "$r" --key "env:$KEY_ENV" --signer "$signer"
          done
        fi

    - name: Push to the run registry
      if: ${{ always() && inputs.push-server != '' && inputs.out != '' }}
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        SERVER: ${{ inputs.push-server }}
        PROJECT: ${{ inputs.push-project }}
        TOKEN_ENV: ${{ inputs.push-token-env }}
        OIDC_AUDIENCE: ${{ inputs.push-oidc-audience }}
      run: |
        # A campaign is pushed as one manifest; otherwise every run directory.
        strife="$RUNNER_TEMP/strife-bin/strife"
        token="env:$TOKEN_ENV"
        [ -z "$OIDC_AUDIENCE" ] || token="github-oidc:$OIDC_AUDIENCE"
        [ -d "$OUT" ] || { echo "::notice::nothing to push: $OUT does not exist"; exit 0; }
        targets=$(find "$OUT" -maxdepth 1 -name campaign.json)
        [ -n "$targets" ] || targets=$(find "$OUT" -name report.json -exec dirname {} \; | sort -u | head -n 50)
        status=0
        for t in $targets; do
          if ! out=$("$strife" push --server "$SERVER" --project "$PROJECT" --token "$token" --fail-on none "$t" 2>&1); then
            echo "::warning title=Strife push failed::$out"
            status=1
            continue
          fi
          echo "$out"
          case "$out" in *"change: regression"*) echo "::error title=Strife regression::$(echo "$out" | head -n1)";; esac
        done
        exit $status

    - name: Upload reports
      if: ${{ always() && inputs.upload == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.out }}
          ${{ inputs.junit }}
        if-no-files-found: ignore

    - name: Verdict
      if: ${{ inputs.fail == 'true' && steps.strife.outputs.exit-code != '0' }}
      shell: bash
      env:
        CODE: ${{ steps.strife.outputs.exit-code }}
        OUTCOME: ${{ steps.strife.outputs.outcome }}
      run: |
        echo "strife finished with outcome '$OUTCOME' (exit code $CODE)"
        exit "$CODE"
