apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: strife-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: strife-agent
    app.kubernetes.io/part-of: strife
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: strife-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strife-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: strife-agent
          image: ghcr.io/kemalhafizh/strife:latest
          command:
            - /usr/local/bin/strife-agent
            - --listen=0.0.0.0:9292
            - --node=$(NODE_NAME)
            - --iface=eth0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: agent-http
              containerPort: 9292
              hostPort: 9292
              protocol: TCP
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - KILL
                - SYS_PTRACE
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
            - name: host-proc
              mountPath: /proc
              readOnly: true
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
