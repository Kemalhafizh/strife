# Home
home_title = "Strife — resilience testing for distributed systems, with proof"
home_description = "Strife attacks your cluster with network partitions, crashes, stalled disks and clock skew, then proves whether every operation stayed correct. Every finding replays exactly and can be signed as audit evidence."
home_eyebrow = "Resilience testing for distributed systems"
home_h1 = "Find the bugs that lose data before your customers do."
home_lead = "Strife attacks your cluster with network partitions, crashes, stalled disks and clock skew, then formally proves whether every operation stayed correct. Every finding replays exactly, and can be signed as audit evidence."
home_cta_try = "Try it in your browser"
home_cta_try_note = "nothing to install"
home_cta_download = "Download free"
home_trust = "Open source (Apache 2.0) · Zero external dependencies · Runs on your infrastructure"
home_proof_eyebrow = "Proof, not claims"
home_proof_h2 = "An acknowledged write disappears. Strife catches it."
home_proof_body = "In this scenario a Raft implementation acknowledges writes before they reach the disk. When the disks stall and every node loses power at once, data the client was told is safe is gone after recovery. Strife simulates ten seconds of cluster life, records every operation, and proves that no ordering can explain the result."
home_proof_note = "This terminal output was produced by the real engine when this site was built. The same seed always yields the same execution, down to its hash."
home_proof_cta = "Replay it in your browser"
home_steps_eyebrow = "How it works"
home_steps_h2 = "Attack, record, prove, shrink."
step1_title = "Attack"
step1_body = "Network partitions, latency, packet loss, kill, pause, cgroup freeze, stalled I/O and clock skew, scheduled from a single 64-bit seed."
step2_title = "Record"
step2_body = "Every client request and response lands in a Jepsen-style history, including the ones whose outcome is unknown."
step3_title = "Prove"
step3_body = "Checkers prove linearizability or a transaction isolation level. Running out of search budget means “unknown”, never a pass."
step4_title = "Shrink & sign"
step4_body = "A violation is reduced to a minimal scenario that replays, and can be signed with Ed25519 as evidence."
home_paths_eyebrow = "Who it is for"
home_paths_h2 = "One engine, three jobs."
path_eng_title = "Engineering teams"
path_eng_body = "Run it on a laptop, in CI through the GitHub Action, or against real clusters: etcd, PostgreSQL, MySQL/TiDB, Valkey, Kafka and Kubernetes."
path_eng_cta = "Read the docs"
path_risk_title = "Risk & compliance"
path_risk_body = "Dossiers that map test results to OJK (POJK 11/2022, SEOJK 29/2022), DORA, SOC 2 and ISO 27001, with the limits of the method stated."
path_risk_cta = "See the compliance mapping"
path_audit_title = "Auditors"
path_audit_body = "Check the signatures on test evidence and on release files yourself, in the browser, without installing or uploading anything."
path_audit_cta = "Verify evidence"
home_real_eyebrow = "On real databases"
home_real_h2 = "What your configuration promises, versus what actually happens."
home_real_body = "Every push to the repository runs real clusters in CI. Some results are anomalies that the isolation level or setup in question allows. They are not database bugs; they are what you need to know before you trust that setup with customer balances."
real_pg_rr = "PostgreSQL 17, REPEATABLE READ: write skew (G2) when checked as serializable."
real_pg_standby = "PostgreSQL 17 with async standbys: reads that break real-time order (G-realtime), even without faults."
real_mysql = "MySQL 8.4, REPEATABLE READ: violates snapshot isolation (G-single)."
real_tidb = "TiDB 8.5, pessimistic mode: violates snapshot isolation (G-single)."
real_valkey = "Valkey 8 with async replicas: stale reads under partition."
real_source = "Source: the live-cluster validation table"
home_numbers_eyebrow = "Numbers you can reproduce"
home_numbers_h2 = "Every number here comes with the command that produced it."
stat_raft_value = "0 / 200"
stat_raft_label = "seeds of correct Raft reported as violating. No false alarms."
stat_sound_value = "0 of 150,030"
stat_sound_label = "valid histories wrongly flagged by the list-append checker; 99.81% of invalid ones caught."
stat_agent_value = "1.36 ms"
stat_agent_label = "median delay of a pause injected through strife-agent, against 43.7 ms through docker exec."
stat_wgl_value = "95–508 k ops/s"
stat_wgl_label = "linearizability checking per core on a single register, depending on how many processes race."
stat_source = "Method & machine"
home_comp_eyebrow = "For regulated finance"
home_comp_h2 = "Technical evidence you can take into an audit."
home_comp_body = "`strife compliance` maps test results to controls that cite DORA, SOC 2, ISO/IEC 27001 and Indonesia's POJK No. 11/POJK.03/2022 and SEOJK No. 29/SEOJK.03/2022, and binds them with a cryptographic signature. A dossier is technical evidence for an auditor, not a certification or a legal opinion."
home_comp_cta = "See the compliance mapping"
home_data_eyebrow = "Your data stays yours"
home_data_h2 = "Nothing is sent to us."
data_local = "The CLI and the agent run on your machines and your network. Strife only talks to the clusters you configure, with no telemetry."
data_browser = "The tools on this site (playground, studio, verifier) run the engine in your browser. Files are not uploaded anywhere."
data_open = "Open source under Apache 2.0, built from the Go standard library alone, so your security team can review all of it."
home_final_h2 = "Start from your own scenario."
home_final_body = "Try the engine in your browser now, or talk to us about testing and auditing your systems."

