home_proof_eyebrow = "Deterministic proof, not claims"
home_proof_h2 = "An acknowledged write disappears, and Strife proves why"
home_proof_body = "In this scenario, a Raft implementation acknowledges writes before fsync reaches the disk. When the disks stall and every node loses power at once, data the client was told is committed vanishes after recovery. Strife simulates ten seconds of cluster life, records 4,429 operations, and proves that no valid linearizable ordering can explain the outcome."
home_proof_note = "This terminal output was generated by the native binary when this site was built. Seed 13 always produces the exact same execution trace and SHA-256 digest."
home_proof_cta = "Replay this scenario in your browser"

home_steps_eyebrow = "Instrument pipeline"
home_steps_h2 = "Schedule faults, record histories, prove invariants, and sign evidence"
step1_title = "Schedule & inject"
step1_body = "Network partitions, latency, packet loss, kill, pause, cgroup v2 freeze, stalled I/O, and clock skew driven from a single 64-bit PRNG seed."
step2_title = "Record operation histories"
step2_body = "Every client invocation and completion lands in a Jepsen-style JSONL history, explicitly preserving indeterminate in-flight operations."
step3_title = "Prove consistency"
step3_body = "WGL linearizability solvers, Elle-style dependency graphs, and ledger invariant checkers verify safety. Exhausted search budgets report unknown, never a pass."
step4_title = "Shrink & sign"
step4_body = "Delta debugging minimizes a failing schedule to the smallest reproducible counterexample, then signs it with an Ed25519 in-toto attestation."

home_paths_eyebrow = "Roles & workflows"
home_paths_h2 = "One verification engine across three critical workflows"
path_eng_title = "Systems engineering teams"
path_eng_body = "Run on a workstation, in CI via the GitHub Action, or against live clusters: etcd, PostgreSQL, MySQL, TiDB, Valkey, Kafka, and Kubernetes."
path_eng_cta = "Read technical docs"
path_risk_title = "Risk & compliance"
path_risk_body = "Generate HTML dossiers and evidence bundles mapping test runs to OJK (POJK 11/2022, SEOJK 29/2022), BI-SP, DORA, SOC 2, and ISO 27001 with explicit scope limits."
path_risk_cta = "Review regulatory mapping"
path_audit_title = "Independent auditors"
path_audit_body = "Verify cryptographic signatures on test evidence bundles and release binaries directly in the browser without installing tooling or uploading files."
path_audit_cta = "Open evidence verifier"

home_real_eyebrow = "Live-cluster database validation"
home_real_h2 = "What your database configuration promises versus what happens under stress"
home_real_body = "Every push runs real containerized database clusters in CI. Several findings are anomalies permitted by the configured isolation level or replication topology—not database bugs, but exact failure modes you must understand before trusting customer balances to that setup."
real_pg_rr = "PostgreSQL 17, REPEATABLE READ: write skew (G2) when verified against strict serializability."
real_pg_standby = "PostgreSQL 17 with async standbys: stale reads violating real-time order (G-realtime), even without injected faults."
real_mysql = "MySQL 8.4, REPEATABLE READ: violates snapshot isolation (G-single / torn queue read)."
real_tidb = "TiDB 8.5, pessimistic mode: violates snapshot isolation (G-single) under concurrent contention."
real_valkey = "Valkey 8 with async replicas: lost acknowledged writes and stale reads during network partition."
real_source = "Source: live-cluster validation table"

