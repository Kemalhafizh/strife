# Home
home_title = "Strife — formal verification & resilience testing for distributed systems"
home_description = "Strife tests your cluster with network partitions, crashes, stalled disks, and clock skew from a single deterministic seed, then formally proves whether every operation stayed consistent."
home_eyebrow = "Resilience verification for distributed systems"
home_h1 = "Find the bugs that lose data before your customers do"
home_lead = "Strife schedules network partitions, process crashes, stalled disk I/O, and clock skew from a single 64-bit seed, then formally proves whether every operation satisfied linearizability or transaction isolation. Every finding replays down to its hash and can be signed as audit evidence."
home_cta_try = "Run in browser"
home_cta_try_note = "no install"
home_cta_download = "Download CLI"
