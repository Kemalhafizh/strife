real_mysql = "MySQL 8.4, REPEATABLE READ: melanggar snapshot isolation (anomali G-single / pembacaan antrean yang sobek)."
real_tidb = "TiDB 8.5 mode pesimistis: melanggar snapshot isolation (G-single) di bawah beban transaksi bersaing."
real_valkey = "Valkey 8 dengan replikasi asinkron: kehilangan penulisan yang sudah diakui dan pembacaan basi saat partisi jaringan."
