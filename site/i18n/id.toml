# Home
home_title = "Strife — uji ketahanan sistem terdistribusi yang bisa dibuktikan"
home_description = "Strife menyerang cluster Anda dengan partisi jaringan, crash, disk macet, dan jam yang melenceng, lalu membuktikan apakah setiap transaksi tetap benar. Hasilnya bisa diputar ulang dan ditandatangani sebagai bukti audit."
home_eyebrow = "Uji ketahanan sistem terdistribusi"
home_h1 = "Temukan bug yang menghilangkan data, sebelum nasabah Anda yang menemukannya."
home_lead = "Strife menyerang cluster Anda dengan partisi jaringan, crash, disk macet, dan jam yang melenceng, lalu membuktikan secara formal apakah setiap operasi tetap benar. Setiap temuan bisa diputar ulang persis sama, dan bisa ditandatangani sebagai bukti audit."
home_cta_try = "Coba di browser"
