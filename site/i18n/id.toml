# Hero forensic trace studio
trace_window_title = "Rekaman jejak kausal · raft-unsafe-fsync"
trace_lanes_label = "Lajur telemetri node & jendela injeksi gangguan (0.000s → 10.000s)"
trace_witness_label = "Saksi pelanggaran linearizability pada register k0"
trace_witness_detail = "p22 membaca k0 → 3 pada 8.940s setelah penulisan p2 (k0 ← 2) dikonfirmasi pada 7.861s namun hilang saat lima node mengalami io-stall + kill serentak."
trace_artifact_timeline = "Buka timeline HTML"
trace_artifact_campaign = "Laporan kampanye"
trace_artifact_dossier = "Dossier kepatuhan"

home_proof_eyebrow = "Bukti deterministik, bukan klaim"
home_proof_h2 = "Satu penulisan yang sudah dikonfirmasi hilang, dan Strife membuktikannya"
home_proof_body = "Pada skenario ini, implementasi Raft mengakui penulisan sebelum fsync benar-benar selesai ke disk. Ketika disk melambat lalu seluruh node kehilangan daya secara bersamaan, transaksi yang sudah dinyatakan berhasil ke klien lenyap setelah pemulihan. Strife mensimulasikan 10 detik eksekusi cluster, merekam 4.429 operasi, dan membuktikan bahwa tidak ada urutan serial yang sah untuk riwayat tersebut."
home_proof_note = "Keluaran terminal di samping dihasilkan langsung oleh biner asli saat situs ini dibangun. Seed 13 selalu menghasilkan jejak eksekusi dan hash yang sama."
home_proof_cta = "Putar ulang skenario ini di browser"

home_steps_eyebrow = "Alur kerja instrumen"
home_steps_h2 = "Jadwalkan gangguan, rekam riwayat, buktikan secara formal, lalu tanda tangani"
step1_title = "Jadwalkan & injeksikan"
step1_body = "Partisi jaringan, latensi, paket hilang, kill, pause, pembekuan cgroup v2, I/O macet, dan pergeseran jam dikendalikan dari satu seed PRNG 64-bit."
step2_title = "Rekam riwayat operasi"
step2_body = "Setiap panggilan dan respons klien dicatat ke dalam riwayat JSONL bergaya Jepsen, termasuk operasi yang menggantung saat jaringan terputus."
step3_title = "Buktikan konsistensi"
step3_body = "Solver WGL, Elle-style dependency graph, dan ledger invariant checker menguji linearizability atau level isolasi. Kehabisan anggaran pencarian selalu dilaporkan sebagai tidak pasti, bukan lulus."
step4_title = "Kecilkan & tanda tangani"
step4_body = "Delta debugging memangkas jadwal gangguan menjadi skenario minimal yang tetap memicu bug, lalu mengikatnya dengan tanda tangan Ed25519 in-toto."

home_paths_eyebrow = "Peran & alur integrasi"
home_paths_h2 = "Satu engine verifikasi untuk tiga fungsi kritis"
path_eng_title = "Tim rekayasa sistem"
