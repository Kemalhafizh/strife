home_proof_h2 = "Satu penulisan yang sudah “berhasil” hilang. Strife menangkapnya."
home_proof_body = "Pada skenario ini, sebuah implementasi Raft mengakui penulisan sebelum datanya benar-benar tersimpan ke disk. Ketika disk macet lalu seluruh node mati bersamaan, data yang sudah dikonfirmasi ke klien hilang setelah pemulihan. Strife mensimulasikan 10 detik kehidupan cluster, merekam setiap operasi, lalu membuktikan bahwa tidak ada urutan yang bisa menjelaskan hasil tersebut."
