home_real_body = "Setiap perubahan kode menjalankan pengujian terhadap kontainer database sungguhan di CI. Sebagian temuan merupakan anomali yang memang diizinkan oleh level isolasi bawaan database tersebut—bukan bug kode database, melainkan celah arsitektur yang wajib Anda pahami sebelum menyimpan saldo nasabah."
