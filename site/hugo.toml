# The website. Build it with site/build.sh, which first generates data/ and
# the WebAssembly module; see site/README.md.

# CI passes the address GitHub Pages reports, so a custom domain set in the
# repository's Pages settings takes effect on the next build. This value is
# only the default for local builds.
baseURL = "https://kemalhafizh.github.io/strife/"
title = "Strife"
defaultContentLanguage = "id"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]
timeZone = "Asia/Jakarta"

[languages.id]
languageName = "Bahasa Indonesia"
languageCode = "id-ID"
contentDir = "content/id"
weight = 1

[languages.en]
languageName = "English"
languageCode = "en"
contentDir = "content/en"
weight = 2

[markup.goldmark.renderer]
unsafe = true # the repository's own Markdown uses a little HTML

[markup.goldmark.parser]
autoHeadingIDType = "github" # so README anchors keep working

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
inline = [["$", "$"]]

[markup.highlight]
noClasses = false
guessSyntax = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

# Documentation is rendered from the repository's own Markdown at build time,
# so the site never carries a stale copy. ROADMAP.md stays internal.
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

# Example reports made by the CLI during the build (build.sh).
[[module.mounts]]
source = "generated"
target = "static"

[[module.mounts]]
source = "../README.md"
target = "assets/repo/README.md"

[[module.mounts]]
source = "../CHANGELOG.md"
target = "assets/repo/CHANGELOG.md"

[[module.mounts]]
source = "../docs"
target = "assets/repo/docs"
includeFiles = ["BENCHMARKS.md", "github-action.md"]

[[module.mounts]]
source = "../examples"
target = "assets/repo/examples"
includeFiles = ["*/README.md"]

[params]
repo = "https://github.com/Kemalhafizh/strife"
description = "Deterministic fault injection, linearizability checking and signed audit evidence for distributed systems."

# Contact channels. Leave a field empty to hide it. The contact form needs at
# least one of email, whatsapp or formEndpoint.
[params.contact]
email = ""        # e.g. halo@example.co.id
whatsapp = ""     # international format, digits only, e.g. 6281234567890
calendar = ""     # a booking page (Cal.com, Google Calendar appointments, ...)
formEndpoint = "" # optional Formspree-compatible endpoint; email is used otherwise
security = ""     # address for vulnerability reports; email is used otherwise

[sitemap]
changeFreq = "weekly"

