{{- $name := . -}}
{{- if reflect.IsMap . -}}{{- $name = .name -}}{{- end -}}
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{{- if eq $name "menu" -}}
  <line x1="4" y1="7" x2="20" y2="7"></line>
  <line x1="4" y1="12" x2="20" y2="12"></line>
  <line x1="4" y1="17" x2="20" y2="17"></line>
{{- else if eq $name "copy" -}}
  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
{{- else if eq $name "check" -}}
  <polyline points="20 6 9 17 4 12"></polyline>
{{- else if eq $name "x" -}}
  <line x1="18" y1="6" x2="6" y2="18"></line>
  <line x1="6" y1="6" x2="18" y2="18"></line>
{{- else if eq $name "alert-triangle" -}}

  <line x1="12" y1="17" x2="12.01" y2="17"></line>
{{- else if eq $name "shield-check" -}}

  <path d="m9 12 2 2 4-4"></path>
{{- else if eq $name "lock" -}}
  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
{{- else if eq $name "terminal" -}}
  <polyline points="4 17 10 11 4 5"></polyline>
  <line x1="12" y1="19" x2="20" y2="19"></line>
{{- else if eq $name "play" -}}
  <polygon points="6 3 20 12 6 21 6 3"></polygon>
{{- else if eq $name "upload" -}}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
  <polyline points="17 8 12 3 7 8"></polyline>
  <line x1="12" y1="3" x2="12" y2="15"></line>
{{- else if eq $name "download" -}}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
  <polyline points="7 10 12 15 17 10"></polyline>
  <line x1="12" y1="15" x2="12" y2="3"></line>
{{- else if eq $name "file-text" -}}
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
  <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
  <line x1="10" y1="9" x2="8" y2="9"></line>
  <line x1="16" y1="13" x2="8" y2="13"></line>
  <line x1="16" y1="17" x2="8" y2="17"></line>
{{- else if eq $name "cpu" -}}

  <rect width="6" height="6" x="9" y="9" rx="1"></rect>
  <path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path>
{{- else if eq $name "database" -}}
  <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
  <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
  <path d="M3 12A9 3 0 0 0 21 12"></path>
{{- else if eq $name "activity" -}}
  <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path>
{{- else if eq $name "git-commit" -}}

  <line x1="3" y1="12" x2="9" y2="12"></line>
  <line x1="15" y1="12" x2="21" y2="12"></line>
{{- else if eq $name "arrow-up-right" -}}
  <line x1="7" y1="17" x2="17" y2="7"></line>
  <polyline points="7 7 17 7 17 17"></polyline>
{{- else if eq $name "arrow-right" -}}
  <line x1="5" y1="12" x2="19" y2="12"></line>
  <polyline points="12 5 19 12 12 19"></polyline>
{{- else if eq $name "sliders" -}}
  <line x1="4" y1="21" x2="4" y2="14"></line>
  <line x1="4" y1="10" x2="4" y2="3"></line>
  <line x1="12" y1="21" x2="12" y2="12"></line>
  <line x1="12" y1="8" x2="12" y2="3"></line>
  <line x1="20" y1="21" x2="20" y2="16"></line>
  <line x1="20" y1="12" x2="20" y2="3"></line>
  <line x1="2" y1="14" x2="6" y2="14"></line>
  <line x1="10" y1="8" x2="14" y2="8"></line>
  <line x1="18" y1="16" x2="22" y2="16"></line>
{{- else if eq $name "key" -}}
  <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path>
  <path d="m21 2-9.6 9.6"></path>
  <circle cx="7.5" cy="15.5" r="5.5"></circle>
{{- else if eq $name "layers" -}}
  <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path>
  <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path>
  <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path>
{{- else if eq $name "book-open" -}}
  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
{{- end -}}
</svg>
