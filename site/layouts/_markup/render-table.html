<div class="table-wrap">
<table>
  <thead>
    {{- range .THead }}
    <tr>{{ range . }}<th{{ with .Alignment }} class="al-{{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>{{ range . }}<td{{ with .Alignment }} class="al-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
    {{- end }}
  </tbody>
</table>
</div>
