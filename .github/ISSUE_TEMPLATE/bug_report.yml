name: Bug Report
description: Report a reproducible bug in the simulator, checkers, live runner, strife-agent, or run registry.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Because Strife runs are seeded, including the `--seed` or `history.jsonl` / `.edn` makes most issues immediately reproducible.
  - type: dropdown
    id: component
    attributes:
      label: Component / Subcommand
      options:
        - "strife sim / campaign (deterministic simulator)"
        - "strife check (kv, set, queue, counter, idgen, txn, append, ledger, settlement)"
        - "strife shrink (scenario, history, or live delta debugging)"
        - "strife run / plan / doctor (live cluster runner & transports incl. proxy)"
        - "strife-agent (Linux Netlink / cgroup v2 / Kubernetes / /probes)"
        - "strife sign / verify / compliance (attestation, SARIF & dossiers)"
        - "strife serve (self-hosted run registry)"
        - "strife bench inject (fault injection benchmarks)"
        - "pkg/workload (WebAssembly VM / presets)"
        - "Website / Documentation"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Command / Seed
      description: Provide the exact CLI command, `--seed`, schedule hash, or attach a minimal `history.jsonl` / `.edn` or `strife.json`.
      placeholder: |
        strife sim --system raft --faults partition,kill --seed 42 --determinism
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What verdict or output did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Strife Version, Go Version & OS
      placeholder: "strife 0.7.0, go1.23+ linux/amd64 (Ubuntu 24.04 kernel 6.8)"
    validations:
      required: true
