name: Bug Report
description: Report a reproducible bug in the simulator, checkers, live runner, or strife-agent.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Because Strife runs are seeded, including the `--seed` or `history.jsonl` makes most issues immediately reproducible.
  - type: dropdown
    id: component
    attributes:
      label: Component / Subcommand
      options:
        - "strife sim / campaign (deterministic simulator)"
        - "strife check (WGL linearizability / Elle / Ledger checker)"
        - "strife shrink (delta debugging)"
        - "strife run / plan (live cluster runner)"
        - "strife-agent (Linux Netlink / cgroup v2 / Kubernetes)"
        - "strife sign / verify / compliance (attestation & dossiers)"
        - "strife serve (self-hosted run registry)"
        - "pkg/workload (WebAssembly VM / presets)"
        - "Website / Documentation"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Command / Seed
      description: Provide the exact CLI command, `--seed`, schedule hash, or attach a minimal `history.jsonl` / `strife.json`.
      placeholder: |
        strife sim --system raft --faults partition,kill --seed 42 --determinism
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What verdict or output did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Strife Version, Go Version & OS
      placeholder: "strife v0.2.0, go1.23 linux/amd64 (Ubuntu 24.04 kernel 6.8)"
    validations:
      required: true
