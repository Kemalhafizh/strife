name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: every release platform builds
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build ./... || { echo "build failed for $p"; exit 1; }
          done
      - name: the libraries the website runs in the browser build for js/wasm
        run: GOOS=js GOARCH=wasm go build ./pkg/explore ./pkg/checker ./pkg/report ./pkg/attest ./pkg/compliance ./pkg/model
      - name: lint the GitHub Action and workflows
        run: |
          shellcheck scripts/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck "$(command -v shellcheck)"
      - name: unit tests (race)
        run: go test -race -short ./...
      - name: full tests (bug-finding regression)
        run: go test ./...
      - name: agent tests that need root (namespaces, cgroups, nf_tables)
        run: sudo -E env "PATH=$PATH" go test -count=1 -run 'TestTargetedContainer|TestStartAsNarrowsRoot|TestDelNetemSparesOtherQdiscs|TestNFTablesReallyDrops|TestSignalsTakeEffect' -v ./pkg/agent

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o strife ./cmd/strife
      - name: correct Raft survives 200 seeds, bit-for-bit deterministic
        run: ./strife sim --system raft --seeds 1..200 --determinism --expect linearizable --out ""
      - name: stale reads are caught
        run: ./strife sim --system raft-stale-reads --faults partition --seeds 1..50 --expect violation --out ""
      - name: wall-clock leases are caught under clock skew
        run: ./strife sim --system raft-lease --faults clock-skew,partition --seeds 1..200 --expect violation --out ""
      - name: lying fsync is caught under crashes and I/O stalls
        run: ./strife sim --system raft-unsafe-fsync --faults kill,io-stall --seeds 1..200 --expect violation --out ""
      - name: a violation shrinks to a minimal, replayable scenario
        run: |
          set +e
          ./strife shrink --system raft-stale-reads --faults partition --seed 2 --out shrunk
          test $? -eq 1 || exit 1
          set -e
          test -f shrunk/raft-stale-reads-seed2-min/report.html
          python3 -c "import json,sys; r=json.load(open('shrunk/raft-stale-reads-seed2-min/report.json')); sys.exit(0 if r['shrink']['minimal_faults'] <= 3 else 1)"
      - name: Wasm workloads replay bit-for-bit
        run: |
          for p in preset:kv-balanced preset:cas-hotspot preset:si-write-skew; do
            ./strife sim --system raft --workload "$p" --seeds 1..20 --determinism --expect linearizable --out ""
          done
      - name: live runner end to end (in-memory store, dry-run nemesis)
        run: ./strife run --config testdata/memory.json --duration 5s --dry-run --quiet

  # Every parser of untrusted bytes, plus the soundness of the list-append
  # checker, under coverage-guided fuzzing (the corpus in testdata/fuzz
  # replays in the regular test job).
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRESP ./pkg/client
          - FuzzPostgresMessages ./pkg/client
          - FuzzMySQLPackets ./pkg/client
          - FuzzKafkaRecords ./pkg/client
          - FuzzReadJSONL ./pkg/history
          - FuzzParseWasm ./pkg/workload
          - FuzzCheckAppendSound ./pkg/txn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz for 45 seconds
        env:
          TARGET: ${{ matrix.target }}
        run: |
          read -r name pkg <<<"$TARGET"
          go test -run '^$' -fuzz "^${name}\$" -fuzztime 45s "$pkg"
      - name: keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ strategy.job-index }}
          path: pkg/*/testdata/fuzz

  # Dogfood the GitHub Action exactly as users consume it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: correct Raft passes through the action
        id: pass
        uses: ./
        with:
          command: sim --system raft --seeds 1..50 --determinism --expect linearizable
          artifact-name: strife-raft
      - name: a violation is reported (without failing this job)
        id: bug
        uses: ./
        with:
          command: sim --system raft-stale-reads --faults partition --seed 2 --shrink
          junit: junit/stale-reads.xml
          artifact-name: strife-stale-reads
          fail: "false"
      - name: outputs and JUnit are what users rely on
        shell: bash
        env:
          PASS_OUTCOME: ${{ steps.pass.outputs.outcome }}
          BUG_OUTCOME: ${{ steps.bug.outputs.outcome }}
          BUG_CODE: ${{ steps.bug.outputs.exit-code }}
          BUG_JUNIT: ${{ steps.bug.outputs.junit }}
        run: |
          test "$PASS_OUTCOME" = passed
          test "$BUG_OUTCOME" = violation
          test "$BUG_CODE" = 1
          python3 - "$BUG_JUNIT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert int(root.get("failures")) > 0, "violation missing from JUnit"
          body = root.find(".//failure").text
          assert "Reproduce:" in body and "strife sim" in body, body
          print("JUnit ok:", root.get("tests"), "tests,", root.get("failures"), "failures")
          PY
          test -f strife-out/raft-stale-reads-seed2-min/report.html
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start a run registry (strife server)
        env:
          STRIFE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-registry
        run: |
          go build -o bin/strife ./cmd/strife
          mkdir -p registry
          echo '{"listen":"127.0.0.1:8088","data":"registry/data","projects":[{"name":"ci","token":"env:STRIFE_TOKEN"}]}' > registry/server.json
          nohup bin/strife server --config registry/server.json > registry/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/healthz && exit 0; sleep 0.5; done
          cat registry/server.log; exit 1
      - name: the action pushes a campaign to the registry
        uses: ./
        env:
          STRIFE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-registry
        with:
          command: campaign --system raft-stale-reads --faults partition --seeds 1..8 --duration 3s
          out: registry-out
          artifact-name: strife-registry
          fail: "false"
          push-server: http://127.0.0.1:8088
          push-project: ci
      - name: the registry holds the campaign
        env:
          STRIFE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-registry
        run: |
          runs=$(curl -fsS -H "Authorization: Bearer $STRIFE_TOKEN" http://127.0.0.1:8088/api/v1/projects/ci/runs)
          echo "$runs"
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert len(r)==1 and r[0]["kind"]=="campaign" and r[0]["source"].endswith(sys.argv[2]), r' "$runs" "$GITHUB_RUN_ID"
          curl -fsS -u "x:$STRIFE_TOKEN" http://127.0.0.1:8088/ui/ci | grep -q raft-stale-reads
