# PostgreSQL 17: a primary (n1) and two asynchronous hot standbys (n2, n3).
# NET_ADMIN lets the nemesis use iptables and tc inside each container.
x-postgres: &postgres
  build: .
  cap_add: [NET_ADMIN]
  environment: &env
    STRIFE_PG_PASSWORD: "${STRIFE_PG_PASSWORD:?set STRIFE_PG_PASSWORD}"
  # The standbys copy the primary at boot.

services:
  n1:
    <<: *postgres
    container_name: strife-postgres1
    networks: { strife: { ipv4_address: 172.31.1.11 } }
  n2:
    <<: *postgres
    container_name: strife-postgres2
    environment: { <<: *env, STRIFE_PRIMARY: 172.31.1.11 }
    depends_on: [n1]
    networks: { strife: { ipv4_address: 172.31.1.12 } }
  n3:
    <<: *postgres
    container_name: strife-postgres3
    environment: { <<: *env, STRIFE_PRIMARY: 172.31.1.11 }
    depends_on: [n1]
    networks: { strife: { ipv4_address: 172.31.1.13 } }

networks:
  strife:
    ipam:
      config: [{ subnet: 172.31.1.0/24 }]
