# Three etcd nodes on a fixed subnet so Strife can address them by IP.
# NET_ADMIN lets the nemesis use iptables and tc inside each container.
x-etcd: &etcd
  build: .
  cap_add: [NET_ADMIN]
  environment: &env
    ETCD_CLUSTER: n1=http://172.30.0.11:2380,n2=http://172.30.0.12:2380,n3=http://172.30.0.13:2380

services:
  n1:
    <<: *etcd
    container_name: strife-etcd1
    environment: { <<: *env, ETCD_NAME: n1 }
    networks: { strife: { ipv4_address: 172.30.0.11 } }
  n2:
    <<: *etcd
    container_name: strife-etcd2
    environment: { <<: *env, ETCD_NAME: n2 }
    networks: { strife: { ipv4_address: 172.30.0.12 } }
  n3:
    <<: *etcd
    container_name: strife-etcd3
    environment: { <<: *env, ETCD_NAME: n3 }
    networks: { strife: { ipv4_address: 172.30.0.13 } }

networks:
  strife:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
