# TiDB (single server, embedded unistore) for Strife's transactional checks.
# TiDB's REPEATABLE READ is snapshot isolation, which is what Strife checks.
services:
  n1:
    image: pingcap/tidb:v8.5.1
    container_name: strife-tidb1
    command: ["-P=4000", "--status=10080", "--store=unistore", "--path=/tmp/tidb"]
    networks: { strife: { ipv4_address: 172.31.3.11 } }

networks:
  strife:
    ipam:
      config: [{ subnet: 172.31.3.0/24 }]
